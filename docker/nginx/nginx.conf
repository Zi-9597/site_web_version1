# Nginx configuration for the PHP application.
server {
    listen 80 default_server;
    server_name _;

    # The project is mounted at this path in both containers.
    root /var/www/html;
    index index.php index.html;

    # Serve existing files and directories directly.
    location / {
        try_files $uri $uri/ =404;
    }

    # Forward PHP scripts to the PHP-FPM service.
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block access to .env and other hidden files.
    location ~ /\. {
        deny all;
    }

    # Support application uploads.
    client_max_body_size 20M;
}
