services:

  nginx-web: 
    image: nginx:alpine
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - php
  php:
    image: image-php
    build: 
      context: ./docker/php/
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
  